<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Vertex Systems - Credential Decrypter</title>
  <style>
    body {
      background-color: #0b0f19;
      color: #00ffcc;
      font-family: monospace;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      display: flex;
      gap: 20px;
      height: 90vh;
    }

    /* Left Panel: Scrollable List */
    .credentials-panel {
      flex: 1;
      max-width: 320px;
      overflow-y: auto;
      border: 1px solid #00ffcc;
      padding: 10px;
    }

    .credential-card {
      background: #161f30;
      border: 1px solid #00a8ff;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      border-radius: 4px;
    }

    .credential-card:hover {
      border-color: #00ffcc;
      background: #1e2d42;
    }

    .credential-card.active {
      border-color: #00ffcc !important;
      background-color: #1e2d42 !important;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
    }

    /* Right Panel: Viewport Container Styling */
    .viewport-panel {
      flex: 3;
      border: 1px solid #00ffcc;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #050811;
      height: 100%;
      padding: 24px !important;
      box-sizing: border-box !important;
    }

    /* Force the PDF frame down from the top edge using calc() */
    .viewport-panel iframe,
    .viewport-panel embed,
    .viewport-panel object {
      width: calc(100% - 40px) !important;
      height: calc(100% - 40px) !important;
      margin-top: 20px !important;
      margin-bottom: 20px !important;
      border: none !important;
      border-radius: 6px !important;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5) !important;
    }

    /* Card Layout with Thumbnail */
    .credential-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #161f30;
      border: 1px solid #00a8ff;
      padding: 10px;
      margin-bottom: 10px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s ease-in-out;
    }

    .credential-card:hover {
      border-color: #00ffcc;
      background: #1e2d42;
    }

    /* Selected Active Card Glow */
    .credential-card.active {
      border-color: #00ffcc !important;
      background-color: #1e2d42 !important;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.5);
    }

    /* Thumbnail Styling */
    .card-thumb {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 3px;
      border: 1px solid #00a8ff;
      flex-shrink: 0;
      background: #050811;
    }

    .credential-card.active .card-thumb {
      border-color: #00ffcc;
      box-shadow: 0 0 6px #00ffcc;
    }

    .card-info h4 {
      margin: 0 0 4px 0;
      font-size: 0.9em;
      color: #00ffcc;
    }

    .card-info p {
      margin: 2px 0;
      font-size: 0.75em;
      color: #a0aec0;
    }
  </style>

  <link rel="icon" href="data:,">

</head>

<body>

  <div class="container">
    <!-- Left Panel: Card Stream -->
    <div id="credentials-list" class="credentials-panel"></div>

    <!-- Right Panel: Viewport -->
    <div id="decrypter-viewport" class="viewport-panel">
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
