<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Vertex Systems - Credential Decrypter</title>
  <style>
    body {
      background-color: #0b0f19;
      color: #00ffcc;
      font-family: monospace;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      display: flex;
      gap: 20px;
      height: 90vh;
    }

    /* Left Panel: Scrollable List */
    .credentials-panel {
      flex: 1;
      max-width: 320px;
      overflow-y: auto;
      border: 1px solid #00ffcc;
      padding: 10px;
    }

    .credential-card {
      background: #161f30;
      border: 1px solid #00a8ff;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      border-radius: 4px;
    }

    .credential-card:hover {
      border-color: #00ffcc;
      background: #1e2d42;
    }

    .credential-card.active {
      border-color: #00ffcc !important;
      background-color: #1e2d42 !important;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
    }

    /* Right Panel: Viewport Container Styling */
    .viewport-panel {
      flex: 3;
      border: 1px solid #00ffcc;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #050811;
      height: 100%;
      padding: 24px !important;
      box-sizing: border-box !important;
    }

    /* Force the PDF frame down from the top edge using calc() */
    .viewport-panel iframe,
    .viewport-panel embed,
    .viewport-panel object {
      width: calc(100% - 40px) !important;
      height: calc(100% - 40px) !important;
      margin-top: 20px !important;
      margin-bottom: 20px !important;
      border: none !important;
      border-radius: 6px !important;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5) !important;
    }

    /* Card Layout with Thumbnail */
    .credential-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #161f30;
      border: 1px solid #00a8ff;
      padding: 10px;
      margin-bottom: 10px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s ease-in-out;
    }

    .credential-card:hover {
      border-color: #00ffcc;
      background: #1e2d42;
    }

    /* Selected Active Card Glow */
    .credential-card.active {
      border-color: #00ffcc !important;
      background-color: #1e2d42 !important;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.5);
    }

    /* Thumbnail Styling */
    .card-thumb {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 3px;
      border: 1px solid #00a8ff;
      flex-shrink: 0;
      background: #050811;
    }

    .credential-card.active .card-thumb {
      border-color: #00ffcc;
      box-shadow: 0 0 6px #00ffcc;
    }

    .card-info h4 {
      margin: 0 0 4px 0;
      font-size: 0.9em;
      color: #00ffcc;
    }

    .card-info p {
      margin: 2px 0;
      font-size: 0.75em;
      color: #a0aec0;
    }
  </style>

  <link rel="icon" href="data:,">

<style>
.credentials-panel { flex: 0 0 420px !important; max-width: 420px !important; width: 420px !important; }
.card-thumb { width: 64px !important; height: 64px !important; }
.card-info h4 { font-size: 1.08rem !important; line-height: 1.3 !important; }
.card-info p { font-size: 0.85rem !important; }
.viewport-panel { flex: 1 1 auto !important; display: flex !important; justify-content: center !important; align-items: center !important; overflow: hidden !important; padding: 16px !important; }
#active-doc-display { width: 100% !important; height: 100% !important; max-width: 100% !important; max-height: 92vh !important; object-fit: contain !important; }
</style>
</head>

<body>

  <div class="container">
    <!-- Left Panel: Card Stream -->
    <div id="credentials-list" class="credentials-panel"></div>

    <!-- Right Panel: Viewport -->
    <div id="decrypter-viewport" class="viewport-panel"><img id="active-doc-display" src="./Credentials/BSc_CIS_CUMLAUDE.png" style="width:100%;height:100%;max-width:100%;max-height:92vh;object-fit:contain;border:1px solid #00ffcc;border-radius:4px;" /></div>
  </div>

  <script>
const files = ["Badge_Google AI Essentials.png", "BSc_CIS_CUMLAUDE.png", "Cert_Advanced Cybersecurity Concepts and Capstone Project.png", "Cert_Connect and Protect_Networks and Network Security.png", "Cert_Cybersecurity Tools and Technologies.png", "Cert_Foundation of Cybersecurity.png", "Cert_Google AI Essentials.png", "Cert_HP_UNIX.png", "Cert_IORS_SysProg.png", "Cert_Mngmentt Data Processing_Project.png", "Cert_Play it Safe_Manage Security Risks.png", "Cert_PRO-IV_SuperLayer.png", "Cert_UoC_Windows Server Management Security.png", "Diploma_Computer Information Systems.png", "Diploma_HND_Computer Studies.png", "PolyGraduateDip_ComputerStudies.png", "Prof-Cert_Google Cybersecurity.png"];
const list = document.getElementById('credentials-list');
const viewer = document.getElementById('active-doc-display');
files.forEach((f, idx) => {
  const card = document.createElement('div');
  card.className = 'credential-card' + (idx === 0 ? ' active' : '');
  card.innerHTML = '<img class="card-thumb" src="./Credentials/' + encodeURIComponent(f) + '" /><div class="card-info"><h4>' + f.replace('.png','').replace(/_/g,' ') + '</h4><p>VERIFIED // PNG TRANSCRIPT</p></div>';
  card.onclick = () => {
    document.querySelectorAll('.credential-card').forEach(c => c.classList.remove('active'));
    card.classList.add('active');
    viewer.src = './Credentials/' + encodeURIComponent(f);
  };
  list.appendChild(card);
});
</script>
</body>

</html>
